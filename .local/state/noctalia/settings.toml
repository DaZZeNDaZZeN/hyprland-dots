config_version = 14

[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.84999999999999998
border = "primary"
border_width = 1.0
center = [ "date", "clock", "spacer_2", "workspaces" ]
end = [
    "media",
    "tray",
    "widget",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
radius = 80
radius_bottom_right = 80
reserve_space = false
scale = 1.1500000096857548
show_on_workspace_switch = false
smart_auto_hide = true
start = [ "launcher", "w-engine-widget", "wallhaven", "active_window" ]
thickness = 38

    [bar.default.dead_zone.actions]
    scroll_down = "volume-down"
    scroll_up = "volume-up"

[brightness]
