[notification]
background_opacity = 0.84999998100101948

[osd]
background_opacity = 0.69999998435378075
offset_y = 4

[plugins]
enabled = [ "noctalia/wallhaven", "oldirtty/color_picker", "tadomika_ari/w-engine" ]

[shell]
polkit_agent = true
screen_time_enabled = true

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "US"
    Kazakh = "KZ"
    Russian = "RU"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.screenshot]
    annotate = true

    [shell.window_switcher]
    mru = true

[theme]
builtin = "Rosé Pine"
community_palette = "ADW"
custom_palette = "my_palette"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/ren/Wallpaper"

    [wallpaper.default]
    path = "/home/ren/Wallpaper/wallhaven-7j99vv.jpg"

    [wallpaper.last]
    path = "/home/ren/Wallpaper/wallhaven-7j99vv.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/ren/Wallpaper/wallhaven-7j99vv.jpg"

    [[wallpaper.favorite]]
    custom_palette = "my_palette"
    palette_source = "custom"
    path = "/home/ren/Wallpaper/wallhaven-7j99vv.jpg"
    theme_mode = "dark"

[weather]
enabled = false

[widget.spacer_2]
type = "spacer"

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "oldirtty/color_picker:widget"